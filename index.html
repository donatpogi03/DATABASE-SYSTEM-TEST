<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Text DB</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; }
    ul { background: #f4f4f4; padding: 20px 40px; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Submit Text to Google Sheet</h2>
  <input type="text" id="userInput" placeholder="Type some text here..." />
  <button onclick="sendText()">Save Text</button>

  <h3>Stored Texts:</h3>
  <ul id="textList">Loading...</ul>

  <script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbyyNSISfsoH6LoL9u5FYFZvnwt5WyCvkwDmwlPRJpN9jMAHA2t6VdWQ-cfokxNZ-CdR/exec";

    async function fetchTexts() {
      const listElement = document.getElementById("textList");
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        
        listElement.innerHTML = "";
        
        result.data.forEach(row => {
          const li = document.createElement("li");
          li.textContent = `${row[0]}: ${row[1]}`;
          listElement.appendChild(li);
        });
      } catch (err) {
        listElement.innerHTML = "<li>Failed to load data</li>";
        console.error(err);
      }
    }

    async function sendText() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      
      if (!text) return alert("Please enter text first!");

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ text: text })
        });
        
        input.value = "";
        fetchTexts();
      } catch (err) {
        alert("Error saving text!");
        console.error(err);
      }
    }

    fetchTexts();
  </script>
</body>
</html>
