<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Web Viewer</title>
  <style>
    :root {
      --excel-green: #107c41;
      --excel-dark-green: #0b582e;
      --excel-border: #d4d4d4;
    }
    
    /* Layout fix for full-screen flex scrolling */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents whole-page double scrollbars */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    header {
      background-color: var(--excel-green);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    header h1 { margin: 0; font-size: 18px; font-weight: 600; }

    /* Input Toolbar */
    .toolbar {
      background: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid var(--excel-border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .toolbar input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 300px;
      font-size: 14px;
    }

    .toolbar button {
      background-color: var(--excel-green);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .toolbar button:hover { background-color: var(--excel-dark-green); }

    /* Scrollable Table Container Fix */
    .table-container {
      flex: 1; /* Takes up all remaining screen height */
      overflow: auto; /* Enables vertical and horizontal scrollbars */
      background: white;
      margin: 10px 15px 45px 15px; /* Bottom margin leaves space for fixed tabs */
      border: 1px solid var(--excel-border);
    }

    /* Excel Grid Styling */
    table.excel-grid {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    table.excel-grid th, table.excel-grid td {
      border: 1px solid var(--excel-border);
      padding: 6px 12px;
      text-align: left;
      white-space: nowrap;
    }

    /* Active cell focus indicator */
    table.excel-grid td[contenteditable="true"]:focus {
      outline: 2px solid var(--excel-green) !important;
      background-color: #ffffff;
    }

    /* Saving feedback states */
    td.saving { background-color: #fff9c4 !important; } /* Yellow */
    td.saved { background-color: #e8f5e9 !important; }  /* Light Green */

    /* Sticky Headers so Column A/B/C stays visible while scrolling */
    table.excel-grid th {
      background-color: #f8f9fa;
      color: #555;
      font-weight: 600;
      text-align: center;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* Row Numbers (1, 2, 3...) */
    table.excel-grid td.row-index {
      background-color: #f8f9fa;
      color: #777;
      text-align: center;
      font-weight: 600;
      width: 40px;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    /* Bottom Sheet Tabs */
    .tabs-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: #e6e6e6;
      border-top: 1px solid var(--excel-border);
      display: flex;
      padding-left: 15px;
      overflow-x: auto; /* Scroll tabs horizontally if there are many */
      z-index: 10;
    }

    .tab-button {
      padding: 6px 18px;
      border: 1px solid var(--excel-border);
      border-bottom: none;
      background: #d9d9d9;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-right: 2px;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      white-space: nowrap;
    }

    .tab-button.active {
      background: white;
      color: var(--excel-green);
      border-top: 3px solid var(--excel-green);
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Google Sheets - Interactive Excel Viewer</h1>
  </header>

  <div class="toolbar">
    <input type="text" id="userInput" placeholder="Add row to active sheet..." />
    <button onclick="addEntry()">+ Add Row</button>
  </div>

  <div class="table-container">
    <table class="excel-grid" id="excelTable">
      <!-- Excel Grid will load here -->
    </table>
  </div>

  <!-- Excel Bottom Sheet Navigation Tabs -->
  <div class="tabs-bar" id="tabsBar"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyyNSISfsoH6LoL9u5FYFZvnwt5WyCvkwDmwlPRJpN9jMAHA2t6VdWQ-cfokxNZ-CdR/exec";

    let globalSheetData = {};
    let activeSheetName = "";

    function getColumnLetter(colIndex) {
      let letter = "";
      while (colIndex >= 0) {
        letter = String.fromCharCode((colIndex % 26) + 65) + letter;
        colIndex = Math.floor(colIndex / 26) - 1;
      }
      return letter;
    }

    async function loadAllSheets() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (json.status === "success") {
          globalSheetData = json.sheets;
          const sheetNames = Object.keys(globalSheetData);

          if (sheetNames.length > 0) {
            renderTabs(sheetNames);
            switchSheet(activeSheetName || sheetNames[0]);
          }
        }
      } catch (err) {
        console.error("Failed to load spreadsheet:", err);
      }
    }

    function renderTabs(names) {
      const tabsBar = document.getElementById("tabsBar");
      tabsBar.innerHTML = "";

      names.forEach(name => {
        const btn = document.createElement("button");
        btn.className = `tab-button ${name === activeSheetName ? 'active' : ''}`;
        btn.textContent = name;
        btn.onclick = () => switchSheet(name);
        tabsBar.appendChild(btn);
      });
    }

    function switchSheet(sheetName) {
      activeSheetName = sheetName;
      renderTabs(Object.keys(globalSheetData));

      const gridData = globalSheetData[sheetName] || [];
      const table = document.getElementById("excelTable");
      table.innerHTML = "";

      if (gridData.length === 0) {
        table.innerHTML = "<tr><td style='padding:20px;'>Sheet is empty</td></tr>";
        return;
      }

      // 1. Build Header Row (A, B, C, D...)
      const maxCols = Math.max(...gridData.map(r => r.length));
      let headerHTML = "<tr><th></th>";
      for (let c = 0; c < maxCols; c++) {
        headerHTML += `<th>${getColumnLetter(c)}</th>`;
      }
      headerHTML += "</tr>";

      // 2. Build Editable Data Rows
      let bodyHTML = "";
      gridData.forEach((row, rowIndex) => {
        bodyHTML += `<tr><td class="row-index">${rowIndex + 1}</td>`;
        for (let colIndex = 0; colIndex < maxCols; colIndex++) {
          const cellValue = row[colIndex] !== undefined ? row[colIndex] : "";
          
          bodyHTML += `<td 
            contenteditable="true" 
            onkeydown="if(event.key==='Enter'){ event.preventDefault(); this.blur(); }"
            onblur="saveCellEdit(${rowIndex}, ${colIndex}, this)"
          >${cellValue}</td>`;
        }
        bodyHTML += "</tr>";
      });

      table.innerHTML = headerHTML + bodyHTML;
    }

    async function saveCellEdit(rowIndex, colIndex, cellElement) {
      const newValue = cellElement.innerText.trim();
      
      // Flash yellow while saving
      cellElement.classList.add("saving");

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateCell",
            sheetName: activeSheetName,
            rowIndex: rowIndex,
            colIndex: colIndex,
            value: newValue
          })
        });

        // Update local memory so data stays intact on tab switch
        if (globalSheetData[activeSheetName] && globalSheetData[activeSheetName][rowIndex]) {
          globalSheetData[activeSheetName][rowIndex][colIndex] = newValue;
        }

        // Flash green when saved
        cellElement.classList.remove("saving");
        cellElement.classList.add("saved");
        setTimeout(() => cellElement.classList.remove("saved"), 1200);

      } catch (err) {
        console.error("Failed to update cell:", err);
        cellElement.classList.remove("saving");
        alert("Failed to save cell edit!");
      }
    }

    async function addEntry() {
      const input = document.getElementById("userInput");
      const val = input.value.trim();
      if (!val) return alert("Please type something!");

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ text: val, sheetName: activeSheetName })
      });

      input.value = "";
      loadAllSheets();
    }

    loadAllSheets();
  </script>
</body>
</html>
