<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup Drive Manager</title>
  <style>
    :root {
      --excel-green: #107c41;
      --excel-dark-green: #0b582e;
      --excel-border: #d4d4d4;
    }
    
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--excel-green);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    header h1 { margin: 0; font-size: 18px; font-weight: 600; }

    .toolbar {
      background: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid var(--excel-border);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-add-drive {
      background-color: var(--excel-green);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add-drive:hover { background-color: var(--excel-dark-green); }

    .table-container {
      flex: 1;
      overflow: auto;
      background: white;
      margin: 10px 15px 45px 15px;
      border: 1px solid var(--excel-border);
      position: relative;
    }

    table.excel-grid {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    table.excel-grid th, table.excel-grid td {
      border: 1px solid var(--excel-border);
      padding: 6px 12px;
      text-align: left;
      white-space: nowrap;
    }

    table.excel-grid th {
      background-color: #f8f9fa;
      color: #555;
      font-weight: 600;
      position: sticky; top: 0; z-index: 2;
    }

    table.excel-grid td.row-index {
      background-color: #f8f9fa;
      color: #777;
      text-align: center;
      font-weight: 600;
      width: 40px;
      position: sticky; left: 0; z-index: 1;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; display: none;
    }

    .modal-card {
      background: white; width: 580px; max-width: 92%;
      border-radius: 8px; padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .modal-card h3 { margin-top: 0; color: var(--excel-green); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-confirm { background: var(--excel-green); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-cancel { background: #e0e0e0; color: #333; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 900; display: none;
    }

    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #e0e0e0; border-top: 4px solid var(--excel-green);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText" style="margin-top:12px; font-weight:600; color:var(--excel-green);">Loading Backup Data...</div>
  </div>

  <header>
    <h1>💾 Backup Drive Sheet Manager</h1>
  </header>

  <div class="toolbar">
    <button class="btn-add-drive" onclick="scanBackupDrive()">📁 Scan Full Backup Drive & Add Row</button>
  </div>

  <div class="table-container">
    <table class="excel-grid" id="excelTable"></table>
  </div>

  <!-- Backup Confirmation Modal -->
  <div class="modal-overlay" id="driveModal">
    <div class="modal-card">
      <h3>📁 Backup Drive Scanned</h3>
      <p style="font-size:13px; color:#666;">Inserting single combined entry into <strong>2024-2025 BACKUP</strong> tab.</p>
      
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>BATCH NUMBER</label>
          <input type="text" id="modalBatchNumber" style="font-weight:bold; color:var(--excel-green);" />
        </div>
        <div class="form-group" style="flex:2;">
          <label>PROJ NAME & FOLDER</label>
          <input type="text" id="modalProjName" placeholder="PROJECT NAME" />
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>TOTAL DRIVE SIZE</label>
          <input type="text" id="modalDriveSize" value="4TB" oninput="calculateSpaceRemaining()" />
        </div>
        <div class="form-group" style="flex:1;">
          <label>SPACE REMAINING</label>
          <input type="text" id="modalSpaceRemaining" placeholder="Calculated..." />
        </div>
        <div class="form-group" style="flex:1;">
          <label>SERIAL NUMBER (S/N)</label>
          <input type="text" id="modalSN" placeholder="e.g. WX32D63E71Z0" />
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmInsertRows()">Insert to Sheet</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyyNSISfsoH6LoL9u5FYFZvnwt5WyCvkwDmwlPRJpN9jMAHA2t6VdWQ-cfokxNZ-CdR/exec";
    const TARGET_TAB = "2024-2025 BACKUP";

    let backupSheetData = [];
    let totalScannedBytes = 0;
    let formattedSize = "0 B";

    function showLoading(msg) {
      document.getElementById("loadingText").textContent = msg;
      document.getElementById("loadingOverlay").style.display = "flex";
    }

    function hideLoading() {
      document.getElementById("loadingOverlay").style.display = "none";
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1000;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = Math.floor(Math.log(bytes) / Math.log(k));
      if (i > 4) i = 4;
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    function getNextBackupBatchNumber() {
      const currentYear = new Date().getFullYear();
      let maxSeq = 0;
      
      backupSheetData.forEach(row => {
        let val = String(row[0] || "").trim();
        if (val.startsWith("B")) val = val.substring(1);
        const parts = val.split('-');
        if (parts.length === 2) {
          const year = parseInt(parts[0], 10);
          const seq = parseInt(parts[1], 10);
          if (year === currentYear && !isNaN(seq) && seq > maxSeq) {
            maxSeq = seq;
          }
        }
      });

      return `B${currentYear}-${String(maxSeq + 1).padStart(3, '0')}`;
    }

    async function getFolderSizeRecursive(dirHandle) {
      let bytes = 0;
      try {
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            const file = await entry.getFile();
            bytes += file.size;
          } else if (entry.kind === 'directory') {
            bytes += await getFolderSizeRecursive(entry);
          }
        }
      } catch (e) { console.warn("Error reading:", e); }
      return bytes;
    }

    function calculateSpaceRemaining() {
      const driveSizeStr = document.getElementById("modalDriveSize").value.trim().toUpperCase();
      let totalDriveBytes = 0;

      if (driveSizeStr.endsWith("TB")) totalDriveBytes = parseFloat(driveSizeStr) * 1000**4;
      else if (driveSizeStr.endsWith("GB")) totalDriveBytes = parseFloat(driveSizeStr) * 1000**3;

      if (totalDriveBytes > 0 && totalDriveBytes >= totalScannedBytes) {
        document.getElementById("modalSpaceRemaining").value = formatBytes(totalDriveBytes - totalScannedBytes);
      }
    }

    async function scanBackupDrive() {
      if (!('showDirectoryPicker' in window)) return alert("Use Google Chrome or Edge.");

      try {
        const dirHandle = await window.showDirectoryPicker();
        showLoading("Calculating total backup drive size...");

        let rawDriveName = dirHandle.name || "";
        let cleanedProjName = rawDriveName.replace(/\s*\([A-Z]:\)/i, '').replace(/[\/\\]/g, '').trim();

        totalScannedBytes = await getFolderSizeRecursive(dirHandle);
        formattedSize = formatBytes(totalScannedBytes);

        hideLoading();

        document.getElementById("modalBatchNumber").value = getNextBackupBatchNumber();
        document.getElementById("modalProjName").value = cleanedProjName;
        calculateSpaceRemaining();

        document.getElementById("driveModal").style.display = "flex";
      } catch (err) {
        hideLoading();
      }
    }

    function closeModal() { document.getElementById("driveModal").style.display = "none"; }

    async function confirmInsertRows() {
      const batchNum = document.getElementById("modalBatchNumber").value.trim();
      const projName = document.getElementById("modalProjName").value.trim();
      const driveSize = document.getElementById("modalDriveSize").value.trim();
      const spaceRemaining = document.getElementById("modalSpaceRemaining").value.trim();
      const sn = document.getElementById("modalSN").value.trim();

      const newRow = [[batchNum, driveSize, projName, projName, formattedSize, spaceRemaining, sn]];

      closeModal();
      backupSheetData.push(newRow[0]);
      renderTable();

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "addMultipleRows", sheetName: TARGET_TAB, rows: newRow })
      });
    }

    async function loadData() {
      showLoading("Loading Backup Data...");
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === "success") {
          backupSheetData = json.sheets[TARGET_TAB] || [];
          renderTable();
        }
      } catch(e) { console.error(e); }
      finally { hideLoading(); }
    }

    function renderTable() {
      const table = document.getElementById("excelTable");
      let html = "<thead><tr><th></th><th>NUMBER</th><th>SIZE</th><th>PROJ NAME</th><th>PROJ FOLDER</th><th>FILE SIZE</th><th>SPACE REMAINING</th><th>S/N</th></tr></thead><tbody>";
      
      backupSheetData.forEach((row, rIdx) => {
        html += `<tr><td class="row-index">${rIdx + 1}</td>`;
        for (let c = 0; c < 7; c++) {
          html += `<td>${row[c] !== undefined ? row[c] : ''}</td>`;
        }
        html += "</tr>";
      });
      html += "</tbody>";
      table.innerHTML = html;
    }

    loadData();
  </script>
</body>
</html>
